name: Sync with upstream

on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/zalando/spilo.git || echo 'upstream remote already exists'
          git fetch upstream || true

      - name: Merge upstream changes into master
        run: |
          git checkout master
          git merge --no-ff upstream/master || {
            echo 'Merge failed, aborting.'
            exit 1
          }

      - name: Check for changes after merge
        id: changes
        run: |
          echo "Comparing local master with origin/master:"
          git log --oneline origin/master..HEAD || echo "No commits ahead"
          # Check if there are new commits (not just file differences)
          if [ "$(git rev-list --count origin/master..HEAD)" -eq 0 ]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No new commits found"
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
            echo "New commits found: $(git rev-list --count origin/master..HEAD)"
          fi

      - name: Push rebase branch if changes
        if: steps.changes.outputs.no_changes == 'false'
        run: |
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/pando85/spilo.git HEAD:upstream-rebase --force

      - name: Create or update PR
        if: steps.changes.outputs.no_changes == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          branch: upstream-rebase
          base: master
          title: 'Rebase: Sync with upstream/master'
          body: 'Automated rebase with upstream changes.'
          commit-message: 'chore: rebase with upstream/master'
          delete-branch: false

